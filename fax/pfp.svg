<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#16231b"/>
      <stop offset="1" stop-color="#060a07"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf8ee"/>
      <stop offset="1" stop-color="#e9e3d0"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5dff9a"/>
      <stop offset="1" stop-color="#14b85a"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <!-- faint grid -->
  <g stroke="#1f3a28" stroke-width="2" opacity=".6">
    <path d="M0 200H1000M0 400H1000M0 600H1000M0 800H1000M200 0V1000M400 0V1000M600 0V1000M800 0V1000"/>
  </g>
  <!-- report sheet -->
  <g transform="rotate(-6 500 500)">
    <rect x="250" y="170" width="440" height="600" rx="22" fill="#000" opacity=".35" transform="translate(14 18)"/>
    <path d="M250 192a22 22 0 0 1 22-22h330l88 88v490a22 22 0 0 1-22 22H272a22 22 0 0 1-22-22z" fill="url(#paper)"/>
    <path d="M602 170v66a22 22 0 0 0 22 22h66z" fill="#d6cfb6"/>
    <text x="290" y="250" font-family="Arial Black, Helvetica, sans-serif" font-weight="900" font-size="46" fill="#0b120d">COIN</text>
    <text x="290" y="296" font-family="Arial Black, Helvetica, sans-serif" font-weight="900" font-size="46" fill="#14b85a">REPORT</text>
    <g font-family="Courier New, monospace" font-weight="700" font-size="25" fill="#2b3a30">
      <text x="290" y="370">DEV RUGS ........ 0</text>
      <text x="290" y="415">BUNDLES ......... 0</text>
      <text x="290" y="460">SNIPERS ......... 0</text>
      <text x="290" y="505">TOP 10 ........ 12%</text>
      <text x="290" y="550">LP .......... BURNT</text>
    </g>
    <g stroke="#cfc7ad" stroke-width="10" stroke-linecap="round">
      <path d="M290 610H560M290 650H500M290 690H540"/>
    </g>
  </g>
  <!-- coin seal -->
  <g transform="translate(640 680)">
    <defs>
      <path id="ring" d="M0 -171a171 171 0 1 1 0 342a171 171 0 1 1 0 -342"/>
    </defs>
    <circle r="214" fill="#000" opacity=".45" transform="translate(10 14)"/>
    <circle r="214" fill="url(#coin)"/>
    <circle r="214" fill="none" stroke="#0b3d1f" stroke-width="6"/>
    <circle r="134" fill="#0b120d"/>
    <circle r="134" fill="none" stroke="#0b3d1f" stroke-width="6"/>
    <!-- ring text -->
    <text font-family="Arial Black, Helvetica, sans-serif" font-weight="900" font-size="44" fill="#0b120d" dominant-baseline="central">
      <textPath href="#ring" startOffset="0" textLength="1060" lengthAdjust="spacing">CLEAN TITLE ★ COINFAX ★ </textPath>
    </text>
    <!-- center -->
    <path d="M-40 -58l26 28 54 -60" fill="none" stroke="#5dff9a" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <text y="58" text-anchor="middle" font-family="Arial Black, Helvetica, sans-serif" font-weight="900" font-size="74" fill="#ffffff">$FAX</text>
  </g>
</svg>
