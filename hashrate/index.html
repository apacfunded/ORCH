<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hashrate</title>
  <meta name="description" content="Hashrate is a pump.fun launchpad where every coin's creator fees rent real hashpower and the mined crypto is paid to holders.">
  <meta name="theme-color" content="#07090c">
  <meta property="og:title" content="Hashrate — every coin runs its own mine">
  <meta property="og:description" content="Launch on pump.fun. Fees rent hashpower on LTC + DOGE, ZEC, KAS, BTC or XMR. Holders get paid in what's mined.">
  <link rel="icon" href="./assets/rig-icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="./styles/tokens.css">
  <link rel="stylesheet" href="./styles/globals.css">
  <script>
    // Site settings. dataSource: "mock" (demo) or "live" (needs apiUrl of the Rig backend).
    window.RIG_CONFIG = { dataSource: "mock", apiUrl: "" };
    try { var t = localStorage.getItem("rig-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript><p style="padding:24px">Hashrate needs JavaScript to show live mining data.</p></noscript>
  <!-- Lightweight Charts (coin page). Three.js and GSAP load after first paint from src/lib/motion.ts and src/components/Shaft.ts. -->
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js" defer onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js';document.head.appendChild(s)"></script>
  <script type="module" src="./dist/main.js"></script>
</body>
</html>
