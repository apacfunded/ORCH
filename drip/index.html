<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drip</title>
<meta name="description" content="Drip ($DRIP). Coming soon.">
<link rel="icon" href="pfp.png">
<style>
:root{--bg:#f6f7fb;--fg:#0e1324;--muted:#5b6478;--accent:#2b5cff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0a0c14;--fg:#eef1f8;--muted:#9aa3b8;--accent:#5b82ff;color-scheme:dark}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Arial,sans-serif;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
img{width:120px;height:120px;border-radius:30px;box-shadow:0 16px 40px rgba(43,92,255,.3)}
h1{font-size:44px;letter-spacing:-.03em;margin:24px 0 8px}
p{color:var(--muted);font-size:18px;margin:0}
span{display:inline-block;margin-top:20px;font-size:14px;color:var(--accent);border:1px solid currentColor;border-radius:999px;padding:6px 14px}
</style>
</head>
<body>
<main>
<img src="pfp.png" alt="Drip">
<h1>Drip</h1>
<p>Buy slowly. Pay less.</p>
<span>Coming soon</span>
</main>
</body>
</html>
