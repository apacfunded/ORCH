name: tally-tick
# Keeps orch.lol/tally running when nobody has it open: opens rounds on the clock,
# records prices and settles markets. Each run pings every 15s for ~5 minutes.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: tally-tick
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - run: |
          for i in $(seq 1 20); do
            curl -fsS --max-time 20 -o /dev/null https://tally-api-eta.vercel.app/api/state || true
            sleep 15
          done
