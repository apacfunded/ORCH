<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cauldron Launchpad</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Brew a memecoin on pump.fun. Halloween launchpad with a brew ritual, costumes, the witching hour and a graveyard.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Cartoon sticker look: flat pumpkin orange, thick ink outlines, hard offset shadows */
:root{
  --bg:#FF7A3D;--surface:#FFF4E8;--raised:#FFE3CB;--line:#140B07;--line-strong:#140B07;
  --text:#140B07;--muted:#5a3a28;--faint:#8a6a55;
  --pumpkin:#FFB347;--pumpkin-deep:#E0601F;--ghost:#9BE58A;--blood:#E0344A;--candle:#FFD56B;
  --ink:#140B07;--paper:#FFF4E8;--tint:rgba(0,0,0,0);
  --display:'Fredoka',system-ui,sans-serif;
  --sans:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --r:18px;--sh:4px 4px 0 var(--ink);
  color-scheme:light;
}
:root[data-witch="1"]{--bg:#3B1245;--surface:#FFE6F2;--raised:#F9CFE2;--pumpkin:#FF6B8A;--pumpkin-deep:#C2184A;--ghost:#9BE58A;--candle:#FFD1DC}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;font-weight:600}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body.shake{animation:shake .5s linear infinite}
@keyframes shake{0%{transform:translate(0,0)}20%{transform:translate(-3px,2px)}40%{transform:translate(3px,-2px)}60%{transform:translate(-2px,-3px)}80%{transform:translate(2px,3px)}100%{transform:translate(0,0)}}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0;font-family:var(--display);font-weight:600}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.bgvid,.shade{display:none}
.tint{position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--tint)}
.sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.flash{position:fixed;inset:0;z-index:70;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:0}10%{opacity:.9}30%{opacity:.1}45%{opacity:.7}100%{opacity:0}}
main,header,footer,.tape{position:relative;z-index:1}
.wand{position:fixed;left:0;top:0;width:18px;height:18px;border-radius:50%;background:var(--ghost);border:3px solid var(--ink);pointer-events:none;z-index:80;transform:translate(-50%,-50%);display:none}
@media (hover:hover) and (pointer:fine){ .wand{display:block} }
.spark{position:fixed;width:8px;height:8px;border-radius:50%;background:var(--ghost);border:2px solid var(--ink);pointer-events:none;z-index:79;animation:spark .7s ease-out forwards}
@keyframes spark{to{transform:translateY(14px) scale(0);opacity:0}}
.tape{background:var(--ink);color:#fff;border-bottom:3px solid var(--ink);overflow:hidden;height:36px;display:flex;align-items:center}
.tape-in{display:flex;gap:40px;white-space:nowrap;animation:tape 40s linear infinite;font:700 13px var(--mono);padding-left:100%}
.tape-in span b{color:var(--ghost);font-weight:700}
.tape-in span i{color:var(--pumpkin);font-style:normal}
@keyframes tape{to{transform:translateX(-100%)}}
.tape:hover .tape-in{animation-play-state:paused}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);border-bottom:3px solid var(--ink);z-index:20}
.bar{display:flex;align-items:center;gap:12px;height:66px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:600 26px var(--display);letter-spacing:-.01em}
.brand img{width:40px;height:40px;border-radius:50%;flex:none;object-fit:cover;border:3px solid var(--ink)}
.bar .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:3px solid var(--ink);background:#fff;color:var(--ink);text-decoration:none;font-size:15px;font-weight:800;cursor:pointer;white-space:nowrap;box-shadow:var(--sh);transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.solid{background:var(--ghost)}
.btn.icon{width:44px;padding:0}
.btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:var(--sh)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;flex:none;display:flex;align-items:center;min-height:40px;padding:0 14px;text-decoration:none;color:var(--muted);font:600 16px var(--display);border-radius:999px;border:3px solid transparent}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);background:var(--pumpkin);border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.count{margin-left:6px;font:700 12px var(--mono);color:var(--faint)}
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:28px;align-items:center;padding-block:36px 14px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font:700 13px var(--mono);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:5px 12px;background:var(--candle);box-shadow:3px 3px 0 var(--ink)}
.hero h1{font-size:clamp(42px,6.6vw,80px);line-height:.98;letter-spacing:-.02em;margin:18px 0 12px;color:var(--paper);-webkit-text-stroke:0;text-shadow:4px 4px 0 var(--ink)}
:root[data-witch="1"] .hero h1{color:var(--paper)}
.hero h1 em{font-style:normal;color:var(--ghost)}
.hero p{color:var(--ink);font-size:18px;max-width:32em;margin:0;font-weight:700}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.clock{margin-top:22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--paper);border:3px solid var(--ink);border-radius:var(--r);padding:12px 16px;box-shadow:var(--sh);max-width:560px}
.clock .digits{font:600 30px var(--display);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock .what{font-size:14px;color:var(--muted);max-width:24em}
.clock.live .digits{color:var(--blood)}
.pot{position:relative;aspect-ratio:1/1;max-width:440px;width:100%;justify-self:center;cursor:pointer}
.pot .potimg{position:absolute;inset:6%;width:88%;height:88%;border-radius:50%;border:4px solid var(--ink);box-shadow:var(--sh);object-fit:cover;animation:bob 3s ease-in-out infinite;pointer-events:none}
.pot canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.riser{position:absolute;left:50%;top:40%;width:26%;aspect-ratio:1/1;border-radius:50%;overflow:hidden;border:4px solid var(--ink);transform:translate(-50%,0) scale(.5);opacity:0;box-shadow:var(--sh)}
.riser img{width:100%;height:100%;object-fit:cover;display:block}
.riser.go{animation:rise 3s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{0%{transform:translate(-50%,10%) scale(.4) rotate(-8deg);opacity:0}25%{opacity:1}60%{transform:translate(-50%,-120%) scale(1) rotate(4deg);opacity:1}100%{transform:translate(-50%,-140%) scale(1) rotate(0);opacity:0}}
.riser-tag{position:absolute;left:50%;top:-6px;transform:translateX(-50%);font:700 13px var(--mono);color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:4px 12px;white-space:nowrap;opacity:0;transition:opacity .3s;box-shadow:3px 3px 0 var(--ink)}
.riser-tag.on{opacity:1}
.pot-hint{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);font:700 12px var(--mono);color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:2px 10px;white-space:nowrap}
.lanterns{display:flex;gap:10px;overflow-x:auto;padding:8px 4px 14px;scrollbar-width:thin}
.lantern{flex:none;width:100px;text-align:center;text-decoration:none;color:inherit}
.lantern svg{width:84px;height:84px;display:block;margin:0 auto;filter:drop-shadow(0 0 calc(var(--glow)*14px) rgba(255,213,107,var(--glow)))}
.lantern .face{fill:#FFD56B;opacity:calc(.2 + var(--glow)*.8)}
.lantern .t{font:700 12px var(--mono);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lantern .v{font:600 11px var(--mono);color:var(--muted)}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 18px}
.stat{display:flex;align-items:baseline;gap:8px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:10px 14px;box-shadow:var(--sh)}
.stat b{font:600 20px var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.spell{flex:1 1 240px;min-width:0;position:relative}
.search{width:100%;min-height:46px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:0 44px 0 16px;font:700 14px var(--mono);box-shadow:var(--sh)}
.search::placeholder{color:var(--faint)}
.search:focus{outline:none;background:#fff}
.spell::after{content:"º6";position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--faint);transition:color .2s}
.spell.glow::after{color:var(--ink)}
.seg{display:inline-flex;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:3px;box-shadow:var(--sh)}
.seg button{min-height:36px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-size:13px;font-weight:800;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px}
.card{display:block;text-decoration:none;background:var(--paper);border:3px solid var(--ink);border-radius:var(--r);overflow:hidden;position:relative;box-shadow:var(--sh);transition:transform .15s,box-shadow .15s}
.card:hover{transform:translate(-2px,-2px) rotate(-1deg);box-shadow:6px 6px 0 var(--ink)}
.card.lev{transform:translate(-2px,-8px) rotate(1deg);box-shadow:6px 10px 0 var(--ink)}
.card .img{aspect-ratio:1/1;max-width:100%;width:100%;display:block;object-fit:cover;background:#111;image-rendering:pixelated;border-bottom:3px solid var(--ink)}
.card .meta{padding:12px 14px 14px}
.card .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card .name{font:600 17px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.card .tick{font:700 12px var(--mono);color:var(--muted);flex:none}
.card .by{font-size:13px;color:var(--muted);margin-top:4px}
.card .mc{display:flex;gap:6px;align-items:baseline;font:700 12px var(--mono);color:var(--muted);margin-top:4px}
.card .mc b{color:var(--ink);font-weight:700}
.tag{position:absolute;top:10px;left:10px;font:700 12px var(--mono);background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:2px 9px;box-shadow:2px 2px 0 var(--ink)}
.tag.live{background:var(--ghost)}
.tag.witch{left:auto;right:10px;background:var(--candle)}
.empty{grid-column:1/-1;border:3px dashed var(--ink);border-radius:var(--r);padding:40px;text-align:center;color:var(--ink);background:var(--paper)}
.note{font:600 12px var(--mono);color:var(--ink);margin-top:14px;opacity:.8}
.up{color:#1f7a2e!important}.down{color:var(--blood)!important}
.page{padding-block:36px 64px}
.page-head{margin-bottom:24px}
.page-head h1{font-size:clamp(36px,5vw,58px);letter-spacing:-.02em;line-height:1.02;color:var(--paper);text-shadow:4px 4px 0 var(--ink)}
.page-head p{color:var(--ink);margin:10px 0 0;max-width:36em;font-size:17px;font-weight:700}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:var(--r);padding:20px;min-width:0;box-shadow:var(--sh)}
.panel h3{font-size:20px;margin-bottom:6px}
.panel p{margin:0;color:var(--muted);font-size:15px}
.panel ul{margin:0;padding-left:18px;color:var(--muted);font-size:15px;display:grid;gap:6px}
.label{display:block;font:700 12px var(--mono);color:var(--ink);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.brew{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.form{display:grid;gap:16px}
.field{display:grid;gap:6px}
.field label{font-size:14px;font-weight:800}
.field input[type=text],.field textarea{width:100%;min-height:48px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:12px 14px;font-size:15px;font-weight:700}
.field input::placeholder,.field textarea::placeholder{color:var(--faint);font-weight:600}
.field textarea{min-height:80px;resize:vertical}
.field .hint{font-size:13px;color:var(--muted)}
.row2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px}
.costumes{display:flex;flex-wrap:wrap;gap:8px}
.costume{min-height:40px;padding:0 14px;border-radius:999px;border:3px solid var(--ink);background:#fff;color:var(--ink);font-size:14px;font-weight:800;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.costume[aria-pressed="true"]{background:var(--pumpkin);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.file-btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:3px dashed var(--ink);border-radius:999px;cursor:pointer;color:var(--ink);position:relative;background:#fff;font-weight:800}
.file-btn input{position:absolute;opacity:0;width:1px;height:1px}
.ritual{display:grid;gap:14px;position:sticky;top:140px}
.spin3d{perspective:800px;width:min(100%,260px);margin:0 auto;aspect-ratio:1/1}
.spin3d img{width:100%;height:100%;border-radius:50%;border:4px solid var(--ink);object-fit:cover;image-rendering:pixelated;background:#111;animation:coinspin 6s linear infinite;box-shadow:var(--sh)}
@keyframes coinspin{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
.ritual .pname{font:600 28px var(--display);line-height:1.1;text-align:center;color:var(--paper);text-shadow:3px 3px 0 var(--ink)}
.ritual .ptick{font:700 15px var(--mono);color:var(--ink);text-align:center}
.ingredients{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ing{min-height:44px;padding:0 14px;border-radius:999px;border:3px solid var(--ink);background:#fff;font-size:14px;font-weight:800;cursor:grab;display:inline-flex;align-items:center;gap:8px;touch-action:none;user-select:none;box-shadow:3px 3px 0 var(--ink)}
.ing.done{opacity:.45;cursor:default;border-style:dashed;box-shadow:none}
.ing.ghosting{opacity:.3}
.minipot{position:relative;height:150px;border-radius:50% 50% 40% 40%/30% 30% 60% 60%;border:3px dashed var(--ink);display:grid;place-items:center;color:var(--ink);font:700 13px var(--mono);transition:background .4s;background:var(--potion,rgba(155,229,138,.35));text-align:center;padding:0 16px}
.minipot.over{border-style:solid;background:var(--ghost)}
.minipot.splash{animation:splash .5s ease-out}
@keyframes splash{0%{transform:scale(1)}30%{transform:scale(1.06)}100%{transform:scale(1)}}
.drag{position:fixed;z-index:90;pointer-events:none;transform:translate(-50%,-50%)}
.cast{position:relative;overflow:hidden;width:100%;min-height:54px;font-size:17px}
.cast .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(0,0,0,.2);transition:none}
.cast span{position:relative}
.log{display:grid;gap:8px;font:700 13px var(--mono);color:var(--ink)}
.log div{display:flex;gap:10px;align-items:center;animation:in .3s ease both}
.log .ok{color:#1f7a2e}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ladle{width:16px;height:16px;flex:none;position:relative;animation:stir 1s linear infinite}
.ladle::before{content:"";position:absolute;left:7px;top:0;width:3px;height:12px;background:var(--ink)}
.ladle::after{content:"";position:absolute;left:3px;bottom:0;width:10px;height:6px;border-radius:0 0 6px 6px;background:var(--ink)}
@keyframes stir{to{transform:rotate(360deg)}}
.yard{perspective:1000px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:26px;align-items:end;padding-top:40px}
.stone{position:relative;background:#D9D2C7;border:3px solid var(--ink);border-radius:110px 110px 12px 12px;padding:36px 18px 18px;text-align:center;min-width:0;transform:rotateX(6deg);transform-origin:50% 100%;transition:transform .4s;box-shadow:var(--sh)}
.stone:hover{transform:rotateX(0) translateY(-4px)}
.stone::after{content:"";position:absolute;left:-12px;right:-12px;bottom:-12px;height:14px;border-radius:50%;background:#3E8B3E;border:3px solid var(--ink);z-index:-1}
.stone .spook{position:absolute;left:50%;top:-10px;width:60px;transform:translate(-50%,20px);opacity:0;transition:transform .6s,opacity .6s;pointer-events:none}
.stone:hover .spook{transform:translate(-50%,-70px);opacity:1}
.stone .rip{font:600 32px var(--display);letter-spacing:.12em;color:var(--ink)}
.stone .who{font:700 15px var(--mono);margin-top:4px}
.stone .epi{font-style:italic;color:var(--muted);font-size:15px;margin:10px 0 12px;min-height:44px}
.stone .facts{display:grid;gap:2px;font:600 12px var(--mono);color:var(--muted)}
.stone .facts b{color:var(--ink);font-weight:700}
.stone .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.candle{display:inline-flex;align-items:center;gap:6px}
.candle .flame{width:8px;height:12px;border-radius:50% 50% 40% 40%;background:var(--pumpkin-deep);border:2px solid var(--ink);animation:flick .9s ease-in-out infinite alternate}
@keyframes flick{from{transform:scaleY(.85)}to{transform:scaleY(1.1)}}
.stone.rising{animation:rising 1.6s ease-out forwards}
@keyframes rising{0%{transform:rotateX(6deg)}30%{transform:rotateX(6deg) translateY(6px)}60%{transform:rotateX(-10deg) translateY(-40px)}100%{transform:rotateX(0) translateY(-400px);opacity:0}}
.hand{position:absolute;left:50%;bottom:-6px;width:40px;transform:translate(-50%,100%);transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.stone.rising .hand{transform:translate(-50%,-20%)}
.coin{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:40px;padding-block:20px 64px}
.coin .art{width:100%;max-width:100%;aspect-ratio:1/1;border-radius:24px;border:4px solid var(--ink);object-fit:cover;image-rendering:pixelated;background:#111;box-shadow:var(--sh)}
.coin h1{font-size:clamp(36px,5vw,58px);letter-spacing:-.02em;margin:12px 0 4px;line-height:1.05;color:var(--paper);text-shadow:4px 4px 0 var(--ink)}
.coin .tk{font:700 20px var(--mono);color:var(--ink)}
.coin .desc{color:var(--ink);margin:14px 0 0;max-width:34em;font-weight:700}
.ca-row{display:flex;gap:10px;align-items:center}
.ca-row code{flex:1;min-width:0;font:600 15px var(--mono);overflow-wrap:anywhere}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}
.fact{background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:14px;min-width:0;box-shadow:var(--sh)}
.fact span{display:block;font:700 12px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.fact b{display:block;font:600 18px var(--display);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink);text-decoration:none;font-size:14px;min-height:44px;margin-top:12px;font-weight:800}
.callout{margin-top:18px;border:3px solid var(--ink);border-left-width:10px;border-radius:14px;padding:12px 14px;color:var(--ink);font-size:14px;background:var(--candle)}
.split{display:flex;height:22px;border-radius:999px;overflow:hidden;border:3px solid var(--ink);margin:14px 0 10px;background:#fff}
.split .burn{width:31%;background:var(--pumpkin-deep);border-right:3px solid var(--ink)}
.split .fund{flex:1;background:repeating-linear-gradient(135deg,var(--ghost) 0 8px,#fff 8px 16px)}
.split-key{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--muted)}

function cardFor(ticker,name,costume='none'){

  const h=hash((name||ticker).toUpperCase()),bg=PAL[h%PAL.length],sh=bg.map(v=>Math.max(0,v-10)),st=12+(h%4)*4;
  const img=x.createImageData(W,W);
  for(let y=0;y<W;y++)for(let i=0;i<W;i++){const col=Math.floor((i+y)/st)%2?bg:sh,p=(y*W+i)*4;img.data[p]=col[0];img.data[p+1]=col[1];img.data[p+2]=col[2];img.data[p+3]=255}
  x.putImageData(img,0,0);
  const label='$'+ticker.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,10);
  const s=Math.max(2,Math.min(9,Math.floor(210/(label.length*6))));
  const draw=(cx,cy,color)=>{let px=Math.round(cx-(label.length*6*s-s)/2);const py=Math.round(cy-7*s/2);x.fillStyle=color;for(const ch of label){const g=FONT[ch];if(g)for(let r=0;r<7;r++)for(let k=0;k<5;k++)if(g[r*5+k]==='1')x.fillRect(px+k*s,py+r*s,s,s);px+=6*s}};
  draw(W/2+2,W/2+12,'#000'); draw(W/2,W/2+10,'#f6ebe3');
  x.fillStyle='#140B07'; x.fillRect(28,Math.round(W/2+10+7*s/2+11),W-56,6);

}

    for(let i=0;i<4&&!reg;i++){ try{ reg=await api('/register',{signature:sig,mint,creator:wallet.pk,name,ticker,description:desc,costume:draft.costume,image:meta.image,uri:meta.uri,witch:witching().live}); }catch(e){ if(i===3||!/not found yet/.test(e.message)) throw e; await sleep(4000); } }
    st.ok();
    const coin={ticker,name,costume:draft.costume,requester:shortAddr(wallet.pk),creator:wallet.pk,at:Date.now(),mc:0,vol:0,chg:null,desc:desc||'Freshly brewed.',mint,kind:'real',witch:witching().live,image:meta.image?gw(meta.image):draft.art};
    if(!LAUNCHES.some(l=>l.kind==='real')){ LAUNCHES.length=0; }
    LAUNCHES.unshift(coin); queue.unshift(coin); REAL.unshift(coin);
    FEED.unshift(`<b>$${esc(ticker)}</b> brewed by ${esc(shortAddr(wallet.pk))}`); snd.cackle(); renderTape();
    $('#brewLog').insertAdjacentHTML('beforeend',`<div class="ok">$${esc(ticker)} is live on pump.fun. <a href="#coin-${esc(ticker.toLowerCase())}">Open its page</a></div>`);
    draft={name:'',ticker:'',desc:'',costume:draft.costume,photo:null,art:null,dropped:{}}; updateCounts();
    setTimeout(()=>{ if(location.hash==='#brew') location.hash='coin-'+ticker.toLowerCase(); },1600);
  }catch(e){
    st?.fail();
    const m=/reject|cancel|denied|4001/i.test(e?.message||'')||e?.code===4001?'You cancelled in your wallet. Nothing was launched.':(e?.message||'The launch failed. Nothing was charged; try again.');
    $('#brewLog').insertAdjacentHTML('beforeend',`<div class="err">${esc(m)}</div>`); toast(m);
  }finally{ brewing=false; readyCheck(); }
}

  const size=()=>{ const r=pot.getBoundingClientRect(), d=devicePixelRatio||1; c.width=r.width*d; c.height=r.height*d; x.setTransform(d,0,0,d,0,0); }; size();
  const frame=(t)=>{ if(!document.body.contains(c)) return; const w=c.clientWidth,h=c.clientHeight; x.clearRect(0,0,w,h);
    if(Math.random()<.15) bubs.push({x:w*.3+Math.random()*w*.4,y:h*.5,r:3+Math.random()*7,v:.6+Math.random(),a:1});

    x.globalAlpha=1; if(!still) potRaf=requestAnimationFrame(frame); };
  potRaf=requestAnimationFrame(frame);

async function loadCoins(){
  try{

    REAL=(j.coins||[]).map(c=>({ticker:c.ticker,name:c.name,costume:c.costume,requester:shortAddr(c.creator),creator:c.creator,at:c.at,mc:0,vol:0,chg:null,desc:c.description||'Freshly brewed.',mint:c.mint,kind:'real',witch:!!c.witch,image:c.image?gw(c.image):null}));
  }catch(e){ console.warn('coins',e); }
  if(!REAL.length) return false;

async function fetchMarket(mints){
  for(let i=0;i<mints.length;i+=30){
    const chunk=mints.slice(i,i+30);
    try{
      const d=await (await fetch('https://api.geckoterminal.com/api/v2/networks/solana/tokens/multi/'+chunk.join(',')+'?include=top_pools')).json();
      const pools=Object.fromEntries((d.included||[]).filter(x=>x.type==='pool').map(x=>[x.id,x.attributes]));
      for(const t of d.data||[]){ const a=t.attributes, pid=t.relationships?.top_pools?.data?.[0]?.id, pool=pools[pid];
        MARKET[a.address]={price:Number(a.price_usd),mc:Number(a.market_cap_usd||a.fdv_usd)||0,vol:Number(a.volume_usd?.h24||0),chg:pool?Number(pool.price_change_percentage?.h24):null,pool:pool?.address}; }
      for(const m of chunk) if(!MARKET[m]) MARKET[m]={none:true,mc:0,vol:0,chg:null};
    }catch(e){}
  }
}
async function refreshMarket(){
  if(!REAL.length) return;
  await fetchMarket(REAL.map(c=>c.mint));
  for(const c of REAL){ const m=MARKET[c.mint]; if(m){ c.mc=m.mc; c.vol=m.vol; c.chg=m.chg; } }
  const dead=REAL.filter(c=>Date.now()-c.at>72*3600e3 && !(c.vol>0));
  const alive=REAL.filter(c=>!dead.includes(c));
  LAUNCHES.splice(0,LAUNCHES.length,...alive); queue=alive.slice();
  GRAVES.splice(0,GRAVES.length,...dead.map(c=>({ticker:c.ticker,name:c.name,peak:c.mc,born:new Date(c.at).toLocaleDateString(undefined,{month:'short',day:'numeric'}),died:'quiet 72h',epitaph:c.desc,candles:0,real:true,mint:c.mint})));
  FEED.splice(0,FEED.length,...REAL.slice(0,12).map(c=>`<b>$${esc(c.ticker)}</b> brewed by ${esc(c.requester)}${c.mc?` · <i>${fmtUsd(c.mc)} MC</i>`:''}`));
  renderTape(); updateCounts(); if($('#grid')) renderGrid();
}

/* ---------- Sky canvas: stars, fireflies, bats, fog, parallax ---------- */
(function(){
  const c=$('#sky'),x=c.getContext('2d'); let w,h,bats=[],bubs=[],stars=[],mx=.5,my=.5,sy=0,hidden=false;
  const INK='#140B07';
  function size(){const d=devicePixelRatio||1;w=innerWidth;h=innerHeight;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0);
    stars=Array.from({length:w<600?10:22},()=>({x:Math.random()*w,y:Math.random()*h*.55,s:4+Math.random()*5,t:Math.random()*6,z:Math.random()}));
    bubs=Array.from({length:w<600?8:16},()=>({x:Math.random()*w,y:h*.3+Math.random()*h*.7,r:4+Math.random()*8,v:.15+Math.random()*.3,p:Math.random()*6}));
    bats=Array.from({length:w<600?3:6},()=>({x:Math.random()*w,y:60+Math.random()*h*.4,vx:.5+Math.random()*.6,vy:0,s:.8+Math.random()*.6,p:Math.random()*6}));}
  addEventListener('pointermove',e=>{mx=e.clientX/w;my=e.clientY/h;},{passive:true}); addEventListener('scroll',()=>{sy=scrollY;},{passive:true});
  document.addEventListener('visibilitychange',()=>{hidden=document.hidden;});
  function star(s,px,py){ const cx=s.x+px*s.z, cy=s.y+py*s.z-sy*.05*s.z, r=s.s*(0.8+0.2*Math.sin(s.t)); x.fillStyle='#FFD56B'; x.strokeStyle=INK; x.lineWidth=2; x.beginPath();
    for(let i=0;i<8;i++){ const a=i*Math.PI/4, rr=i%2?r*.45:r; x.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr); } x.closePath(); x.fill(); x.stroke(); }
  function bat(b,t){const f=Math.sin(t*.012+b.p)*.9,s=b.s*11; x.fillStyle=INK; x.strokeStyle=INK; x.lineWidth=3; x.lineJoin='round'; x.beginPath();x.moveTo(b.x,b.y);x.quadraticCurveTo(b.x-s,b.y-s*f,b.x-2.4*s,b.y-s*.3*f);x.quadraticCurveTo(b.x-1.4*s,b.y+.3*s,b.x,b.y+.6*s);x.quadraticCurveTo(b.x+1.4*s,b.y+.3*s,b.x+2.4*s,b.y-s*.3*f);x.quadraticCurveTo(b.x+s,b.y-s*f,b.x,b.y);x.fill();x.stroke();
    x.fillStyle='#fff'; x.beginPath(); x.arc(b.x-s*.25,b.y+s*.1,s*.14,0,6.283); x.arc(b.x+s*.25,b.y+s*.1,s*.14,0,6.283); x.fill(); }
  function hills(witch){
    const base=h-Math.min(70,h*.08)+sy*.1;
    x.fillStyle=witch?'#24102B':'#1F6B2E'; x.strokeStyle=INK; x.lineWidth=4; x.beginPath(); x.moveTo(-10,h+10); x.lineTo(-10,base+40);
    for(let i=0;i<=w+200;i+=200){ x.quadraticCurveTo(i+100,base-22,i+200,base+40); } x.lineTo(w+10,h+10); x.closePath(); x.fill(); x.stroke();
    // tombstones
    for(let i=120;i<w;i+=260){ const tx=i+((i/260)%2)*60, ty=base+26; x.fillStyle='#D9D2C7'; x.beginPath(); x.moveTo(tx-16,ty+40); x.lineTo(tx-16,ty); x.arc(tx,ty,16,Math.PI,0); x.lineTo(tx+16,ty+40); x.closePath(); x.fill(); x.stroke();
      x.strokeStyle=INK; x.lineWidth=3; x.beginPath(); x.moveTo(tx-7,ty+10); x.lineTo(tx+7,ty+10); x.moveTo(tx,ty+4); x.lineTo(tx,ty+22); x.stroke(); x.lineWidth=4; }
  }
  function frame(t){
    if(hidden){requestAnimationFrame(frame);return;} x.clearRect(0,0,w,h);
    const px=(mx-.5)*20, py=(my-.5)*12; const witch=document.documentElement.dataset.witch==='1';
    for(const s of stars){ if(!still) s.t+=.03; star(s,px,py); }
    const mxx=w-Math.min(150,w*.2)+px*.3, myy=130+py*.3-sy*.08, mr=Math.min(64,w*.09);
    x.fillStyle=witch?'#FF6B8A':'#FFF4E8'; x.strokeStyle=INK; x.lineWidth=4; x.beginPath(); x.arc(mxx,myy,mr,0,6.283); x.fill(); x.stroke();
    x.fillStyle=witch?'#C2184A':'#E8DCC8'; [[-.3,-.2,.18],[.25,.15,.13],[-.05,.35,.1]].forEach(([a,b,r])=>{x.beginPath();x.arc(mxx+a*mr,myy+b*mr,r*mr,0,6.283);x.fill();});
    for(const f of bubs){ if(!still){f.p+=.02;f.x+=Math.sin(f.p)*f.v;f.y-=f.v*.6; if(f.y<-20){f.y=h+20;f.x=Math.random()*w;}} x.fillStyle='#9BE58A'; x.strokeStyle=INK; x.lineWidth=3; x.beginPath(); x.arc(f.x+px*.6,f.y+py*.6-sy*.15,f.r,0,6.283); x.fill(); x.stroke(); x.fillStyle='#fff'; x.beginPath(); x.arc(f.x+px*.6-f.r*.35,f.y+py*.6-sy*.15-f.r*.35,f.r*.22,0,6.283); x.fill(); }
    for(const b of bats){ if(!still){ const dx=b.x-mx*w, dy=b.y-my*h, d=Math.hypot(dx,dy); if(d<140){ b.vx+=dx/d*.4; b.vy+=dy/d*.4; } b.vx+=(0.6-b.vx)*.02; b.vy*=.95; b.x+=b.vx; b.y+=b.vy+Math.sin(t*.002+b.p)*.4; if(b.x>w+40){b.x=-40;b.y=60+Math.random()*h*.4;} if(b.y<20)b.y=20; if(b.y>h*.7)b.y=h*.7; } bat({...b,x:b.x+px*.8,y:b.y+py*.8},still?0:t); }
    hills(witch);
    if(!still) requestAnimationFrame(frame);
  }
  addEventListener('resize',()=>{size();if(still)frame(0);}); size(); requestAnimationFrame(frame);
})();

/* ---------- Wand cursor ---------- */
(function(){ const wand=$('#wand'); if(!matchMedia('(hover:hover) and (pointer:fine)').matches||still) return; let n=0;
  addEventListener('pointermove',e=>{ wand.style.left=e.clientX+'px'; wand.style.top=e.clientY+'px'; if(++n%3===0){ const s=document.createElement('span'); s.className='spark'; s.style.left=e.clientX+(Math.random()*10-5)+'px'; s.style.top=e.clientY+(Math.random()*10-5)+'px'; document.body.appendChild(s); setTimeout(()=>s.remove(),700); } },{passive:true}); })();

</script>
